name: vulcaestus

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-vulcaestus}:${POSTGRES_PASSWORD:-vulcaestus}@postgres:5432/${POSTGRES_DB:-vulcaestus}?schema=public
  REDIS_URL: redis://redis:6379
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  API_URL: http://api:4000
  OLLAMA_BASE_URL: http://ollama:11434
  BROWSER_WORKER_URL: http://browser-worker:4100
  PROMPTS_DIR: /app/prompts
  STORAGE_DIR: /data
  TRUST_PROXY: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulcaestus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulcaestus}
      POSTGRES_DB: ${POSTGRES_DB:-vulcaestus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-n8n.sh:/docker-entrypoint-initdb.d/10-init-n8n.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulcaestus} -d ${POSTGRES_DB:-vulcaestus}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-vulcaestus}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-vulcaestus}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      VULCAESTUS_API_URL: http://api:4000
      VULCAESTUS_SERVICE_KEY: ${SERVICE_API_KEY:-change-me-service-key}
      VULCAESTUS_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      VULCAESTUS_DEFAULT_PROFILE_ID: ${DEFAULT_PROFILE_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: vulcaestus-api:local
    command:
      [
        "node",
        "/app/packages/database/node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema",
        "/app/packages/database/prisma/schema.prisma",
      ]
    working_dir: /app/packages/database
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vulcaestus}:${POSTGRES_PASSWORD:-vulcaestus}@postgres:5432/${POSTGRES_DB:-vulcaestus}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: vulcaestus-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./storage:/data
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  browser-worker:
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    image: vulcaestus-browser-worker:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4100"
      HOST: 0.0.0.0
      WORKER_SECRET: ${BROWSER_WORKER_SECRET:-change-me-worker-secret}
      API_URL: http://api:4000
      STORAGE_DIR: /data
      PROFILES_DIR: /data/profiles
      DRY_RUN: ${DRY_RUN:-true}
      HEADLESS: ${HEADLESS:-true}
      MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-1}
      ACTION_TIMEOUT_MS: ${WORKER_ACTION_TIMEOUT_MS:-120000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ./browser/profiles:/data/profiles
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    image: vulcaestus-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:

networks:
  internal:
    driver: bridge
